name: Security CI
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Docker
        run: |
          sudo apt-get update && sudo apt-get install -y docker.io

      - name: Run security scans
        env:
          FAIL_ON_FINDINGS: ${{ secrets.FAIL_ON_FINDINGS || '0' }}
        run: |
          bash tools/security_scan.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-artifacts
          path: artifacts/security
      - name: Post summary to PR (if PR)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting summary comment to PR"
          sudo apt-get update && sudo apt-get install -y jq
          # install gh if missing
          if ! command -v gh >/dev/null; then
            type=$(uname -m)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          SUMMARY=$(cat artifacts/security/summary.txt || echo '{}')
          echo "$SUMMARY"
          echo "$SUMMARY" | gh pr comment ${{ github.event.pull_request.number }} --body "Security scan summary:\n\n\`\`\`json\n$(cat -)\n\`\`\`" || true

  dast-scan:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt || true

      - name: Start app in background
        run: |
          # start Flask app on port 8000 in background for DAST; use a simple gunicorn if available
          python -m pip install gunicorn >/dev/null
          nohup gunicorn -b 127.0.0.1:8000 lab_server.app:app &
          APP_PID=$!
          echo "Started app (pid=$APP_PID)"
          # wait for app to be healthy
          for i in {1..10}; do
            if curl -sSf http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "App healthy"
              break
            fi
            sleep 1
          done
          # set temporary ADMIN_HMAC_SECRET for authenticated warmup
          export ADMIN_HMAC_SECRET="$(python - <<PY
import secrets
print(secrets.token_urlsafe(32))
PY
          )"
          export ADMIN_HMAC_SECRET
          echo "Admin HMAC secret generated for DAST run"

      - name: Warm authenticated endpoints
        run: |
          export ADMIN_HMAC_SECRET="$ADMIN_HMAC_SECRET"
          HMAC=$(python tools/generate_admin_hmac.py)
          curl -s -H "X-ADMIN-HMAC: $HMAC" http://127.0.0.1:8000/decode-login || true

      - name: Run ZAP baseline scan
        run: |
          docker run -v $(pwd):/zap/wrk/:Z -t owasp/zap2docker-stable zap-baseline.py -t http://127.0.0.1:8000 -r zap-report.html || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
      - name: Teardown app
        if: always()
        run: |
          pkill -f 'gunicorn' || true
          echo "Teardown complete"
  file-issues:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-scan-artifacts

      - name: Install gh
        run: |
          sudo apt-get update && sudo apt-get install -y gh jq

      - name: Create issues for findings
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SUMMARY_FILE=artifacts/security/summary.txt
          if [[ ! -f "$SUMMARY_FILE" ]]; then
            echo "No summary file found; skipping issue filing"
            exit 0
          fi
          summary=$(cat "$SUMMARY_FILE")
          pip_vulns=$(echo "$summary" | jq -r '.pip_audit_vulns // 0')
          bandit=$(echo "$summary" | jq -r '.bandit_issues // 0')
          semgrep=$(echo "$summary" | jq -r '.semgrep_findings // 0')
          echo "Parsed summary: pip=$pip_vulns bandit=$bandit semgrep=$semgrep"
          if [[ "$pip_vulns" -gt 0 ]]; then
            gh issue create --title "Security: pip-audit found $pip_vulns vulnerabilities" --body "pip-audit found $pip_vulns vulnerabilities. See security artifacts." || true
          fi
          if [[ "$bandit" -gt 0 ]]; then
            gh issue create --title "Security: bandit found $bandit issues" --body "bandit found $bandit issues. See security artifacts." || true
          fi
          if [[ "$semgrep" -gt 0 ]]; then
            gh issue create --title "Security: semgrep found $semgrep findings" --body "semgrep found $semgrep findings. See security artifacts." || true
          fi

  create-remediation-pr:
    runs-on: ubuntu-latest
    needs: file-issues
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-scan-artifacts

      - name: Install gh and jq
        run: |
          sudo apt-get update && sudo apt-get install -y gh jq git

      - name: Create remediation branch and draft PR if findings exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY_FILE=artifacts/security/summary.txt
          if [[ ! -f "$SUMMARY_FILE" ]]; then
            echo "No summary file; skipping remediation PR"
            exit 0
          fi
          summary=$(cat "$SUMMARY_FILE")
          pip_vulns=$(echo "$summary" | jq -r '.pip_audit_vulns // 0')
          bandit=$(echo "$summary" | jq -r '.bandit_issues // 0')
          semgrep=$(echo "$summary" | jq -r '.semgrep_findings // 0')
          total=$((pip_vulns + bandit + semgrep))
          echo "Total findings: $total"
          if [[ "$total" -eq 0 ]]; then
            echo "No findings; nothing to do"
            exit 0
          fi
          BRANCH="remediation/security-$(date -u +%Y%m%d%H%M%S)"
          git config user.email "security-bot@github"
          git config user.name "security-bot"
          git checkout -b "$BRANCH"
          # create a remediation.md summarizing findings
          cat > REMEDIATION.md <<EOF
          # Security Remediation Plan

          Summary of findings:

          
          
          ```json
          $summary
          ```

          Actions recommended:
          - Rotate secrets found, and store in external secrets manager.
          - Address semgrep findings (see artifacts/semgrep.json).
          - Review bandit issues and fix insecure code paths.
          - Pin dependencies and update vulnerable packages.

          Artifacts are attached to the security CI run. See the `security-scan-artifacts` artifact for full reports.
          EOF
          git add REMEDIATION.md
          # generate suggested patches from semgrep results
          python tools/generate_remediation_patches.py || true
          if [[ -d REMEDIATION_PATCHES ]]; then
            git add REMEDIATION_PATCHES || true
          fi
          # generate conservative autofix patches
          python tools/generate_autofix_patches.py || true
          if [[ -d AUTO_FIXES ]]; then
            git add AUTO_FIXES || true
          fi
          git commit -m "chore: add remediation plan for security scan findings" || true
          git push --set-upstream origin "$BRANCH"
          # create a draft PR and attach patches as files in the branch
          gh pr create --title "Security: remediation plan (automated)" --body-file REMEDIATION.md --draft || true

