name: Apply secrets allowlist
on:
  pull_request_review:
    types: [submitted]

jobs:
  apply-allowlist:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for allowlist file
        id: check
        run: |
          if [ -f "secrets-allowlist.txt" ]; then echo "found=true"; else echo "found=false"; fi
      - name: Merge allowlist into .secrets-ignore
        if: steps.check.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create a branch and commit the merged ignore
          git checkout -b apply-secrets-allowlist
          if [ -f .secrets-ignore ]; then cat .secrets-ignore > merged.tmp; else touch merged.tmp; fi
          cat secrets-allowlist.txt >> merged.tmp
          # dedupe
          sort -u merged.tmp > .secrets-ignore
          git add .secrets-ignore
          git commit -m "chore(secrets): apply allowlist entries from PR"
          git push --set-upstream origin apply-secrets-allowlist
          # open PR back to default branch
          gh pr create --title "Apply secrets allowlist" --body "Applying approved secrets allowlist entries" --base $(git rev-parse --abbrev-ref origin/HEAD | sed 's|origin/||') --head apply-secrets-allowlist || true
