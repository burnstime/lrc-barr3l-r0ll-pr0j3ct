name: CI
on: [push, pull_request]
jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install truffleHog
        run: |
          python -m pip install --upgrade pip
          pip install truffleHog
      - name: Run truffleHog filesystem scan
        run: |
          # truffleHog expects a git_url or repo_path; use --repo_path . to scan the checked-out repo
          trufflehog filesystem --repo_path . --json > findings.json || true
          if [ -s findings.json ]; then
            echo "Potential secrets found by truffleHog:";
            cat findings.json;
            exit 1;
          else
            echo "No secrets found by truffleHog.";
          fi

  test:
    name: Unit tests & smoke
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lab_server/requirements.txt pytest
          # install the project so tests can import package modules
          pip install -e .
      - name: Run unit tests
        run: pytest -q
      - name: Smoke tests
        run: |
          pytest tests/test_leftrightbarrelroll.py::test_smoke || true
