name: CI
on: [push, pull_request]
jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install scanner deps
        run: |
          python -m pip install --upgrade pip
      - name: Run local secrets scanner
        run: |
          python tools/secrets_scanner.py .

  test:
    name: Unit tests & smoke
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lab_server/requirements.txt pytest
          # install the project so tests can import package modules
          pip install -e .
      - name: Run unit tests
        run: pytest -q
      - name: Smoke tests
        run: |
          pytest tests/test_leftrightbarrelroll.py::test_smoke || true
