name: CI
on: [push, pull_request]
jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install scanner deps
        run: |
          python -m pip install --upgrade pip
      - name: Run local secrets scanner
        id: scan
        run: |
          # run scanner and capture output to findings.txt (do not fail here)
          python tools/secrets_scanner.py . > findings.txt || true
          if [ -s findings.txt ]; then echo "found=true" >> $GITHUB_OUTPUT; else echo "found=false" >> $GITHUB_OUTPUT; fi
      - name: Upload findings artifact
        if: steps.scan.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: secrets-findings
          path: findings.txt
      - name: Comment on PR with findings summary
        if: ${{ github.event_name == 'pull_request' && steps.scan.outputs.found == 'true' }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('findings.txt','utf8').trim();
            const lines = raw.split(/\r?\n/).filter(Boolean);
            const max = 5;
            const items = lines.slice(0, max).map(l => {
              // expected format: - path: message
              const m = l.replace(/^\-\s*/, '');
              const idx = m.indexOf(':');
              if (idx > 0) {
                const path = m.slice(0, idx).trim();
                const msg = m.slice(idx+1).trim();
                // try to show a small context snippet from file
                let snippet = '';
                try {
                  const content = fs.readFileSync(path, 'utf8');
                  const s = content.split(/\r?\n/).slice(0,5).join('\n');
                  snippet = '\n```\n' + s + '\n```\n';
                } catch (e) {
                  snippet = '';
                }
                return `- **${path}**: ${msg}${snippet}`;
              }
              return `- ${m}`;
            });
            let body = 'Secrets scanner found potential findings (showing up to 5):\n\n';
            body += items.join('\n');
            if (lines.length > max) {
              body += `\n\nAnd ${lines.length - max} more findings. See attached artifact for full list.`;
            }
            body += '\n\nIf these are false positives, propose entries via a `secrets-allowlist.txt` file in a PR and approve it to automatically add to `.secrets-ignore`.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fail on scanner findings (opt-in)
        if: steps.scan.outputs.found == 'true' && env.SCANNER_FAIL_ON_FINDINGS == '1'
        env:
          SCANNER_FAIL_ON_FINDINGS: ${{ secrets.SCANNER_FAIL_ON_FINDINGS || '0' }}
        run: |
          echo "Secrets scanner found findings; failing job." >&2
          cat findings.txt >&2
          exit 1

  test:
    name: Unit tests & smoke
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lab_server/requirements.txt pytest
          # install the project so tests can import package modules
          pip install -e .
      - name: Run unit tests
        run: pytest -q
      - name: Smoke tests
        run: |
          pytest tests/test_leftrightbarrelroll.py::test_smoke || true
